<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | Yigit</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.gr-assets.com">
    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
    <link rel="dns-prefetch" href="https://wsrv.nl">
    <!-- Add Playfair Display & JetBrains Mono explicitly for the 'Classical' look -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css?v=6.0">
</head>

<body>
    <div class="container fade-in">
        <header class="hero" style="font-family: 'Playfair Display', serif; align-items: center; text-align: center;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; width: 100%; font-family: 'Inter', sans-serif;">
                <a href="/" class="glass-card back-btn">
                    <span class="arrow" style="transform: rotate(180deg); margin-right: 8px;">→</span> Portfolio
                </a>

                <h1 style="font-family: 'Playfair Display', serif; margin: 0;">Library.</h1>

                <a href="https://www.goodreads.com/user/show/199124060" target="_blank" rel="noopener noreferrer"
                    class="glass-card repo-btn">
                    <span style="font-size: 1.1rem; margin-right: 8px;">📖</span>
                    Goodreads <span class="arrow" style="margin-left: 8px;">→</span>
                </a>
            </div>

            <p class="subtitle"
                style="font-family: 'Playfair Display', serif; font-style: italic; max-width: 600px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; font-size: 1.1rem;">
                A reader lives a thousand lives.<br>
                Synced from my <a href="https://www.goodreads.com/user/show/199124060" target="_blank"
                    rel="noopener noreferrer"
                    style="color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--accent-color);"><strong
                        style="color: #a7a7a7;">Goodreads</strong></a>.
            </p>
        </header>

        <section class="section">
            <div class="reading-header-row">
                <div>
                    <div class="section-eyebrow">Ex Libris</div>
                    <h2 class="section-title" id="reading-shelf-heading" style="font-family: 'Playfair Display', serif; margin-bottom: 0;">All Shelves</h2>
                </div>
                <div class="reading-shelf-tabs" role="tablist" aria-label="Bookshelf Filter">
                    <button class="reading-shelf-btn active" role="tab" aria-selected="true" data-shelf="all">
                        All <span class="shelf-count" id="count-all">0</span>
                    </button>
                    <button class="reading-shelf-btn" role="tab" aria-selected="false" data-shelf="currently-reading">
                        Reading <span class="shelf-count" id="count-reading">0</span>
                    </button>
                    <button class="reading-shelf-btn" role="tab" aria-selected="false" data-shelf="to-read">
                        Want to Read <span class="shelf-count" id="count-toread">0</span>
                    </button>
                    <button class="reading-shelf-btn" role="tab" aria-selected="false" data-shelf="read">
                        Read <span class="shelf-count" id="count-read">0</span>
                    </button>
                </div>
            </div>
            <div id="goodreads-books-container" class="classical-books-grid">
            </div>
        </section>

        <!-- Library Navigation Dock -->
        <nav class="library-nav-dock" aria-label="Library Navigation">
            <div class="library-nav-pill">
                <a href="/library/cinema" class="lib-nav-item">🎬 Cinema</a>
                <a href="/library/music" class="lib-nav-item">🎵 Music</a>
                <a href="/library/reading" class="lib-nav-item active">📖 Library</a>
            </div>
        </nav>

        <footer>
            <p>&copy; 2026 yiğit.</p>
        </footer>
    </div>

    <script type="module" src="../assets/js/pages/reading.js?v=6.0"></script>
</body>


</html>

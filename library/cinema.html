<body>
    <div id="ambient-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <!-- Cinematic Dark Gradient Background for this page only -->
    <div class="cinema-bg-glow"></div>

    <div class="container fade-in">
        <header class="hero subpage-hero subpage-hero--serif">
            <div class="subpage-bar">
                <a href="/" class="glass-card back-btn">
                    <span class="arrow arrow-back">→</span> Portfolio
                </a>

                <h1 class="subpage-title">Cinema.</h1>

                <a href="https://letterboxd.com/oneyigit/" target="_blank" rel="noopener noreferrer"
                    class="glass-card repo-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" class="btn-icon">
                        <circle cx="6" cy="12" r="3" fill="#00e054" />
                        <circle cx="12" cy="12" r="3" fill="#40bcf4" />
                        <circle cx="18" cy="12" r="3" fill="#ff8000" />
                    </svg>
                    Letterboxd <span class="arrow arrow-forward">→</span>

            </div>

            <p class="subtitle">
                A film is a petrified fountain of thought.<br>

                    class="source-link source-link--letterboxd"><strong>Letterboxd</strong></a>.
            </p>

        <!-- All-Time Favorites -->
        <section class="section">
            <div class="section-eyebrow">Curated</div>
            <h2 class="section-title">All-Time Favorites</h2>
            <div class="animated-filmstrip-container">
                <div id="movies-favorites-container" class="animated-filmstrip-track">
                </div>
            </div>
        </section>

        <!-- Recent Watches -->
        <section class="section">
            <div class="section-eyebrow">Diary</div>
            <h2 class="section-title">Recent Watches</h2>
            <div id="movies-recent-container" class="scroll-strip">
            </div>
        </section>

        <!-- Watchlist -->
        <section class="section">
            <div class="section-eyebrow">Up Next</div>
            <h2 class="section-title">Watchlist</h2>
            <div id="movies-watchlist-container" class="scroll-strip">
            </div>
        </section>

        <nav class="library-nav-dock" aria-label="Library Navigation">
            <div class="library-nav-pill">
                <a href="/library/cinema" class="lib-nav-item active">🎬 Cinema</a>
                <a href="/library/music" class="lib-nav-item">🎵 Music</a>

    <script>window.__PREFETCH_SPOTIFY__ = fetch("/api/spotify", { priority: "high" }).then(r => r.ok ? r.json() : null).catch(() => null);</script>
</head>

<body>
    <div id="ambient-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="container fade-in">
        <header class="hero subpage-hero">
            <div class="subpage-bar">
                <a href="/" class="glass-card back-btn">
                    <span class="arrow arrow-back">→</span> Portfolio
                </a>

                <h1 class="subpage-title">Heavy Rotation.</h1>

                <a href="https://open.spotify.com/user/tn0gcrn9xffpr0eyx7idcyiwx?si=03a909ce0bcd437e" target="_blank"
                    rel="noopener noreferrer" class="glass-card repo-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#1DB954" class="btn-icon">
                        <path
                            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.659.3 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.24 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.239.54-.959.72-1.56.3z" />
                    </svg>
                    Spotify <span class="arrow arrow-forward">→</span>
                </a>
            </div>

            <p class="subtitle">
                Synced from my <a href="https://open.spotify.com/user/tn0gcrn9xffpr0eyx7idcyiwx?si=03a909ce0bcd437e"
                    target="_blank" rel="noopener noreferrer"
                    class="source-link source-link--spotify"><strong>Spotify</strong></a> & <a href="https://www.last.fm/user/simplyigit"
                    target="_blank" rel="noopener noreferrer"
                    class="source-link source-link--lastfm"><strong>Last.fm</strong></a>.<br><span id="music-period-label">My most played this month.</span>
            </p>
        </header>

        <!-- Music Section with Tabbed Selector -->
        <section class="section music-section">
            <div class="music-selector-wrapper">
                <div class="music-nav-pill" role="tablist" aria-label="Music View Selector">
                    <!-- Segment 1: Past Month -->
                    <div class="music-pill-segment">
                        <div class="music-segment-header active" id="period-badge-monthly" aria-hidden="true">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="music-period-icon"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>Past Month</span>
                        </div>
                        <div class="music-pill-btn-group">
                            <button class="music-tab-btn active" role="tab" id="tab-tracks" aria-selected="true"
                                aria-controls="music-pane-tracks" data-tab="tracks" title="Top tracks listened over the past month">Tracks</button>
                            <button class="music-tab-btn" role="tab" id="tab-artists" aria-selected="false"
                                aria-controls="music-pane-artists" data-tab="artists" title="Top artists listened over the past month">Artists</button>
                        </div>
                    </div>

                    <div class="music-pill-divider" aria-hidden="true"></div>

                    <!-- Segment 2: All-Time -->
                    <div class="music-pill-segment">
                        <div class="music-segment-header" id="period-badge-alltime" aria-hidden="true">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="music-period-icon"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.267-8-12.356-8-5.096 0-5.096 8 0 8 5.089 0 7.261-8 12.356-8Z"></path></svg>
                            <span>All-Time</span>
                        </div>
                        <div class="music-pill-btn-group">
                            <button class="music-tab-btn" role="tab" id="tab-albums" aria-selected="false"
                                aria-controls="music-pane-albums" data-tab="albums" title="All-time favorite albums">Albums</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="music-panes-container" id="music-panes-container">
                <!-- Tracks Pane (Active by default) -->
                <div id="music-pane-tracks" class="music-tab-pane active" role="tabpanel" aria-labelledby="tab-tracks">
                    <div id="spotify-tracks-container" class="spotify-tracks-grid">
                    </div>
                </div>

                <!-- Artists Pane -->
                <div id="music-pane-artists" class="music-tab-pane" role="tabpanel" aria-labelledby="tab-artists"
                    style="display: none;">
                    <div id="spotify-artists-container" class="spotify-artists-grid">
                    </div>
                </div>

                <!-- Albums Pane (All-Time Favorites) -->
                <div id="music-pane-albums" class="music-tab-pane" role="tabpanel" aria-labelledby="tab-albums"
                    style="display: none;">
                    <div id="spotify-albums-container" class="spotify-albums-grid">
                    </div>
                </div>
            </div>
        </section>

        <!-- Library Navigation Dock -->
        <nav class="library-nav-dock" aria-label="Library Navigation">
            <div class="library-nav-pill">
                <a href="/library/cinema" class="lib-nav-item">🎬 Cinema</a>
                <a href="/library/music" class="lib-nav-item active">🎵 Music</a>
                <a href="/library/reading" class="lib-nav-item">📖 Reading</a>
            </div>
        </nav>

        <footer>
            <p>&copy; 2026 yiğit.</p>
        </footer>
    </div>

    <script type="module" src="../assets/js/pages/music.js?v=7.0"></script>
</body>


</html>

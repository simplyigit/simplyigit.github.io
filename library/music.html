<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Rotation | Yigit</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.scdn.co" crossorigin>
    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
    <link rel="dns-prefetch" href="https://wsrv.nl">
    <link rel="preconnect" href="https://coverartarchive.org">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css?v=2.9">
</head>

<body>
    <div class="container fade-in">
        <header class="hero" style="align-items: center; text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <a href="/" class="glass-card back-btn">
                    <span class="arrow" style="transform: rotate(180deg); margin-right: 8px;">→</span> Portfolio
                </a>

                <h1 style="margin: 0; font-size: 3rem;">Heavy Rotation.</h1>

                <a href="https://open.spotify.com/user/tn0gcrn9xffpr0eyx7idcyiwx?si=03a909ce0bcd437e" target="_blank"
                    rel="noopener noreferrer" class="glass-card repo-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#1DB954" style="margin-right: 8px;">
                        <path
                            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.659.3 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.24 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.239.54-.959.72-1.56.3z" />
                    </svg>
                    Spotify <span class="arrow" style="margin-left: 8px;">→</span>
                </a>
            </div>

            <p class="subtitle"
                style="max-width: 600px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px;">
                Synced from my <a href="https://open.spotify.com/user/tn0gcrn9xffpr0eyx7idcyiwx?si=03a909ce0bcd437e"
                    target="_blank" rel="noopener noreferrer"
                    style="color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--accent-color);"><strong
                        style="color: #96aa9f;">Spotify</strong></a> & <a href="https://www.last.fm/user/simplyigit"
                    target="_blank" rel="noopener noreferrer"
                    style="color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--accent-color);"><strong
                        style="color: #a49292;">Last.fm</strong></a>.<br><span id="music-period-label">My most played this month.</span>
            </p>
        </header>

        <!-- Music Section with Tabbed Selector -->
        <section class="section music-section">
            <div class="music-selector-wrapper">
                <div class="music-nav-pill" role="tablist" aria-label="Music View Selector">
                    <div class="music-pill-group">
                        <button class="music-tab-btn active" role="tab" id="tab-tracks" aria-selected="true"
                            aria-controls="music-pane-tracks" data-tab="tracks">Tracks</button>
                        <button class="music-tab-btn" role="tab" id="tab-artists" aria-selected="false"
                            aria-controls="music-pane-artists" data-tab="artists">Artists</button>
                        <span class="music-group-period active" id="period-badge-monthly">1m</span>
                    </div>
                    <div class="music-pill-divider" aria-hidden="true"></div>
                    <div class="music-pill-group">
                        <button class="music-tab-btn" role="tab" id="tab-albums" aria-selected="false"
                            aria-controls="music-pane-albums" data-tab="albums">Albums</button>
                        <span class="music-group-period" id="period-badge-alltime">all-time</span>
                    </div>
                </div>
            </div>

            <div class="music-panes-container" id="music-panes-container">
                <!-- Tracks Pane (Active by default) -->
                <div id="music-pane-tracks" class="music-tab-pane active" role="tabpanel" aria-labelledby="tab-tracks">
                    <div id="spotify-tracks-container" class="spotify-tracks-grid">
                    </div>
                </div>

                <!-- Artists Pane -->
                <div id="music-pane-artists" class="music-tab-pane" role="tabpanel" aria-labelledby="tab-artists"
                    style="display: none;">
                    <div id="spotify-artists-container" class="spotify-artists-grid">
                    </div>
                </div>

                <!-- Albums Pane (All-Time Favorites) -->
                <div id="music-pane-albums" class="music-tab-pane" role="tabpanel" aria-labelledby="tab-albums"
                    style="display: none;">
                    <div id="spotify-albums-container" class="spotify-albums-grid">
                    </div>
                </div>
            </div>
        </section>

        <!-- Library Navigation Dock -->
        <nav class="library-nav-dock" aria-label="Library Navigation">
            <div class="library-nav-pill">
                <a href="/library/cinema" class="lib-nav-item">🎬 Cinema</a>
                <a href="/library/music" class="lib-nav-item active">🎵 Music</a>
                <a href="/library/reading" class="lib-nav-item">📖 Library</a>
            </div>
        </nav>

        <footer>
            <p>&copy; 2026 yiğit.</p>
        </footer>
    </div>

    <script type="module" src="../assets/js/pages/music.js?v=4.6"></script>
</body>


</html>

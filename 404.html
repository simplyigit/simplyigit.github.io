    <style>
        .not-found-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;

        }

        .not-found-code {
            margin: 0;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--text-secondary);
        }

        .not-found-card h1 {
            font-size: 2.2rem;
            line-height: 1.15;
        }

        .not-found-text {
            margin: 0;
            max-width: 46ch;
            color: var(--text-secondary);
        }

        .not-found-text code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.88em;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        @media screen and (max-width: 768px) {
            .not-found-card {
                padding: 28px 24px;
            }

            .not-found-card h1 {
                font-size: 1.8rem;
            }
        }
    </style>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real, Deepfake or AI | yiğit</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=6.6">
    <script>(function(){var d=document.documentElement;try{var n=performance.getEntriesByType("navigation")[0];if("PageRevealEvent" in window&&document.referrer&&new URL(document.referrer).origin===location.origin&&(!n||n.type!=="reload"))d.classList.add("vt-nav")}catch(e){}var done=function(){setTimeout(function(){d.classList.remove("vt-nav")},1000)};addEventListener("pagereveal",function(e){window.__NAV_VT__=e.viewTransition||null;if(e.viewTransition)e.viewTransition.finished.then(done,done);else done()},{once:true})})();</script>
</head>

<body>
    <div id="ambient-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="container fade-in">

        <section class="section"
            style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/" class="glass-card back-btn">
                <span class="arrow" style="transform: rotate(180deg); margin-right: 8px;">→</span> Portfolio
            </a>

            <a href="https://github.com/simplyigit/Real-Deepfake-or-AI" target="_blank" rel="noopener noreferrer"
                class="glass-card repo-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                    <path
                        d="M9 19c-5 1.5-5-5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                    </path>
                </svg>
                Repository <span class="arrow" style="margin-left: 8px;">→</span>
            </a>
        </section>

        <section class="section">
            <div class="list-grid">
                <div class="glass-card list-card fade-in delay-1"
                    style="flex-direction: column; align-items: flex-start; gap: 24px;">
                    <img src="/projects/real-deepfake-or-ai/real-deepfake-or-ai-thumb.webp"
                        fetchpriority="high"
                        width="1440" height="810"
                        style="width: 100%; height: auto; object-fit: cover; border-radius: 10px; margin-top: 4px;"
                        alt="Real, Deepfake or AI">

                    <!-- Interactive Sandbox -->
                    <div class="detector-demo-card" id="detector-demo">
                        <div class="detector-demo-header">
                            <h2 class="detector-demo-title">Interactive Sandbox</h2>
                            <div class="detector-controls" role="tablist" aria-label="Sample Presets">
                                <button type="button" class="detector-sample-btn sample-btn-real active" data-sample="real" role="tab" aria-selected="true">
                                    Real
                                </button>
                                <button type="button" class="detector-sample-btn sample-btn-ai" data-sample="ai" role="tab" aria-selected="false">
                                    AI Synth
                                </button>
                                <button type="button" class="detector-sample-btn sample-btn-df" data-sample="deepfake" role="tab" aria-selected="false">
                                    Deepfake
                                </button>
                                <label class="detector-upload-btn" id="detector-upload-label" for="detector-file-input" title="Analyze a local image in your browser (.jpg, .jpeg, .png, .webp)">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    <span id="detector-upload-text">Test Custom Image</span>
                                    <input type="file" id="detector-file-input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden>
                                </label>
                            </div>
                        </div>

                        <!-- Main Interactive Grid: Visual Scan + Probabilities -->
                        <div class="detector-workbench">
                            <div class="detector-visual-pane">
                                <div class="detector-canvas-wrap" id="detector-canvas-wrap">
                                    <canvas id="detector-preview-canvas" width="224" height="224"></canvas>
                                    <div class="detector-scan-line"></div>
                                </div>
                            </div>

                            <div class="detector-results-pane">
                                <div class="detector-verdict-row">
                                    <div class="verdict-inline-group">
                                        <span class="verdict-eyebrow">CLASS</span>
                                        <div class="verdict-badge" id="detector-verdict-badge">REAL</div>
                                    </div>
                                    <div class="verdict-inline-group">
                                        <span class="verdict-eyebrow">CONFIDENCE</span>
                                        <div class="verdict-conf-val" id="detector-verdict-conf">96.4%</div>
                                    </div>
                                </div>

                                <div class="detector-bars">
                                    <div class="prob-row">
                                        <div class="prob-label-row">
                                            <span class="prob-name">[0] Real</span>
                                            <span class="prob-val" id="prob-val-real">96.4%</span>
                                        </div>
                                        <div class="prob-track"><div class="prob-fill fill-real" id="prob-bar-real" style="width: 96.4%"></div></div>
                                    </div>
                                    <div class="prob-row">
                                        <div class="prob-label-row">
                                            <span class="prob-name">[1] AI Fake</span>
                                            <span class="prob-val" id="prob-val-ai">3.4%</span>
                                        </div>
                                        <div class="prob-track"><div class="prob-fill fill-ai" id="prob-bar-ai" style="width: 3.4%"></div></div>
                                    </div>
                                    <div class="prob-row">
                                        <div class="prob-label-row">
                                            <span class="prob-name">[2] Deepfake</span>
                                            <span class="prob-val" id="prob-val-df">0.2%</span>
                                        </div>
                                        <div class="prob-track"><div class="prob-fill fill-df" id="prob-bar-df" style="width: 0.2%"></div></div>
                                    </div>
                                </div>

                                <div class="detector-status-msg" id="detector-status-msg" aria-live="polite" hidden></div>
                            </div>
                        </div>
                    </div>

                    <div id="github-content" style="width: 100%;">
                        <p style="text-align: center; color: var(--text-secondary);">Loading project data from GitHub
                            <span class="loading-dots">...</span>
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Yigit.</p>
        </footer>
    </div>

    <script type="module" src="../../assets/js/pages/project-detail.js?v=6.6"></script>
</body>

</html>

                <div>
                    <h2 class="section-title" id="reading-shelf-heading">All Shelves</h2>
                </div>
                <div class="reading-shelf-tabs" role="tablist" aria-label="Bookshelf Filter">
                    <button class="reading-shelf-btn active" role="tab" id="shelf-tab-all" aria-selected="true" aria-controls="goodreads-books-container" data-shelf="all">
                        All <span class="shelf-count" id="count-all">0</span>
                    </button>
                    <button class="reading-shelf-btn" role="tab" id="shelf-tab-reading" aria-selected="false" aria-controls="goodreads-books-container" data-shelf="currently-reading">
                        Reading <span class="shelf-count" id="count-reading">0</span>
                    </button>
                    <button class="reading-shelf-btn" role="tab" id="shelf-tab-to-read" aria-selected="false" aria-controls="goodreads-books-container" data-shelf="to-read">
                        Want to Read <span class="shelf-count" id="count-toread">0</span>
                    </button>
                    <button class="reading-shelf-btn" role="tab" id="shelf-tab-read" aria-selected="false" aria-controls="goodreads-books-container" data-shelf="read">
                        Read <span class="shelf-count" id="count-read">0</span>
                    </button>
                </div>
            </div>
            <div id="goodreads-books-container" class="classical-books-grid" role="tabpanel" aria-labelledby="shelf-tab-all">
            </div>
